<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSTER - Spring Semester</title>

<style>
:root{
    --blue:#0b2f66;
    --green:#16a34a;
    --bg:#f3f4f6;
    --white:#ffffff;
}

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg);
}

.topbar{
    background:var(--blue);
    color:white;
    text-align:center;
    padding:18px;
    font-size:22px;
    font-weight:bold;
}

.student-card{
    background:white;
    margin:15px;
    border-radius:12px;
    padding:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.student-card h2{
    margin:0;
}

.student-card p{
    margin:5px 0;
}

.card{
    background:white;
    margin:15px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.header,
.row{
    display:grid;
    grid-template-columns:1fr 80px 90px;
    align-items:center;
    padding:12px;
}

.header{
    background:var(--blue);
    color:white;
    font-weight:bold;
}

.row{
    border-bottom:1px solid #e5e7eb;
}

.grade{
    width:45px;
    height:45px;
    border-radius:50%;
    border:4px solid var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--green);
    font-weight:bold;
    font-size:13px;
}

.btn{
    background:var(--green);
    color:white;
    border:none;
    border-radius:6px;
    padding:8px;
    cursor:pointer;
}

#gpa{
    text-align:center;
    padding:18px;
    font-size:20px;
    font-weight:bold;
}

#details{
    display:none;
    margin:15px;
}

.back{
    background:var(--green);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.circle{
    width:180px;
    height:180px;
    border-radius:50%;
    border:10px solid var(--green);
    margin:20px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    background:white;
}

.boxes{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
}

.box{
    background:white;
    width:120px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}
</style>

</head>

<body>

<div class="topbar">MUSTER</div>

<div class="student-card">
<h2>Mohamed Sherif Mohamed Kamel</h2>
<p>Student ID: 200068479</p>
<p>Spring Semester 2025–2026</p>
</div>

<div id="list" class="card">

<div class="header">
<div>Subject</div>
<div>Grade</div>
<div>Action</div>
</div>

<div class="row">
<div>PHY102</div>
<div class="grade">C</div>
<button class="btn" onclick="showDetails('PHY102','C',3,'16/30','15/30','13/20','31/60')">Details</button>
</div>

<div class="row">
<div>MATH102</div>
<div class="grade">A-</div>
<button class="btn" onclick="showDetails('MATH102','A-',3,'27/30','25/30','N/A','78/90')">Details</button>
</div>

<div class="row">
<div>CS103</div>
<div class="grade">B-</div>
<button class="btn" onclick="showDetails('CS103','B-',3,'20/30','19/30','15/20','36/60')">Details</button>
</div>

<div class="row">
<div>IS101</div>
<div class="grade">B+</div>
<button class="btn" onclick="showDetails('IS101','B+',3,'24/30','22/30','16/20','42/60')">Details</button>
</div>

<div class="row">
<div>UCNI101</div>
<div class="grade">A</div>
<button class="btn" onclick="showDetails('UCNI101','A',2,'93/100','-','-','-')">Details</button>
</div>

<div class="row">
<div>UHUMN101</div>
<div class="grade">A</div>
<button class="btn" onclick="showDetails('UHUMN101','A',2,'95/100','-','-','-')">Details</button>
</div>

<div class="row">
<div>UHUMN102</div>
<div class="grade">B</div>
<button class="btn" onclick="showDetails('UHUMN102','B',2,'82/100','-','-','-')">Details</button>
</div>

<div id="gpa">
Semester GPA: 3.17 / 4.00
</div>

</div>

<div id="details">

<button class="back" onclick="goBack()">← Back</button>

<div class="card" style="padding:20px;text-align:center;">

<h2 id="course"></h2>
<p id="hours"></p>

<div class="circle" id="gradeCircle"></div>

<div class="boxes">

<div class="box">
<strong>Quiz 1</strong><br>
<span id="q1"></span>
</div>

<div class="box">
<strong>Quiz 2</strong><br>
<span id="q2"></span>
</div>

<div class="box">
<strong>Practical</strong><br>
<span id="practical"></span>
</div>

<div class="box">
<strong>Final</strong><br>
<span id="final"></span>
</div>

</div>

</div>

</div>

<script>

function showDetails(course,grade,hours,q1,q2,practical,finalExam){

document.getElementById("list").style.display="none";
document.getElementById("details").style.display="block";

document.getElementById("course").innerText=course;
document.getElementById("hours").innerText=hours + " Credit Hours";
document.getElementById("gradeCircle").innerText=grade;

document.getElementById("q1").innerText=q1;
document.getElementById("q2").innerText=q2;
document.getElementById("practical").innerText=practical;
document.getElementById("final").innerText=finalExam;

}

function goBack(){
document.getElementById("details").style.display="none";
document.getElementById("list").style.display="block";
}

</script>

</body>
</html>
